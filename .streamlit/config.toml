# Streamlit settings for this project.

[browser]
# Do not send anonymous usage statistics to Streamlit.
gatherUsageStats = false

# Visual theme: cool grey page, white panels, navy ink, one blue accent.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f3f5f8"
secondaryBackgroundColor = "#e7ebf0"
textColor = "#142033"
borderColor = "#dce1e8"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.65rem"
dataframeHeaderBackgroundColor = "#eef1f5"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"

[client]
# Hide the developer toolbar ("Deploy" button) for a cleaner view.
toolbarMode = "minimal"
